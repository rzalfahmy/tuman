<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وقت الصلاة</title>
    <link rel="stylesheet" href="styles4.css" />
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <style>
      .jadwal-table tr.active {
        background-color: #ffe08a;
        font-weight: bold;
        transition: background 0.3s ease;
      }
      #countdown {
        margin: 15px 0;
        font-size: 1.5em;
        text-align: center;
        font-weight: bold;
        color: #2c3e50;
      }
      #countdown span {
        display: block;
        font-size: 0.8em;
        font-weight: normal;
        margin-bottom: 5px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <header class="dashboard-header">
        <h1>وقت الصلاة</h1>
      </header>
      <main class="dashboard-content">
        <div id="countdown">
          <span>Sholat berikutnya</span>
          Memuat...
        </div>
        <table id="jadwalSholat" class="jadwal-table">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Pukul</th>
            </tr>
          </thead>
          <tbody>
            <!-- Jadwal sholat akan diisi -->
          </tbody>
        </table>
      </main>
    </div>

    <script>
      const method = 1; // Metode Karachi

      // Fungsi request dengan timeout
      function fetchWithTimeout(resource, options = {}) {
        const { timeout = 5000 } = options;
        return Promise.race([
          fetch(resource),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Request Timeout")), timeout)
          ),
        ]);
      }

      // Cache
      function saveCache(data) {
        const today = new Date().toISOString().split("T")[0];
        localStorage.setItem(
          "jadwalSholat",
          JSON.stringify({ date: today, data })
        );
      }

      function loadCache() {
        const cache = localStorage.getItem("jadwalSholat");
        if (!cache) return null;
        const { date, data } = JSON.parse(cache);
        const today = new Date().toISOString().split("T")[0];
        return date === today ? data : null;
      }

      function fetchJadwalSholat(latitude, longitude, useCache = true) {
        const cached = loadCache();
        if (useCache && cached) {
          displayJadwalSholat(cached.timings, cached.meta.timezone);
          return;
        }

        const url = `https://api.aladhan.com/v1/timings/${Math.floor(
          Date.now() / 1000
        )}?latitude=${latitude}&longitude=${longitude}&method=${method}`;

        fetchWithTimeout(url, { timeout: 5000 })
          .then((response) => response.json())
          .then((data) => {
            if (data.code === 200) {
              const jadwal = data.data.timings;
              const location = data.data.meta.timezone;
              displayJadwalSholat(jadwal, location);
              saveCache(data.data);
            } else {
              console.error("Data tidak ditemukan.");
            }
          })
          .catch((error) => console.error("Error fetch jadwal:", error));
      }

      function displayJadwalSholat(jadwal, location) {
        const tbody =
          document.getElementById("jadwalSholat").getElementsByTagName("tbody")[0];

        function convertToDateTime(timeString) {
          const [hours, minutes] = timeString.split(":").map(Number);
          const now = new Date();
          now.setHours(hours, minutes, 0, 0);
          return now;
        }

        function addHours(date, hours) {
          const result = new Date(date);
          result.setHours(result.getHours() + hours);
          return result;
        }

        const subuhTime = convertToDateTime(jadwal.Fajr);
        const duhaTime = addHours(subuhTime, 2);

        tbody.innerHTML = `
          <tr data-time="${jadwal.Imsak || ""}"><td>Imsak</td><td>${jadwal.Imsak || "-"}</td></tr>
          <tr data-time="${jadwal.Fajr}"><td>Subuh</td><td>${jadwal.Fajr}</td></tr>
          <tr data-time="${duhaTime.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}"><td>Duha</td><td>${duhaTime.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</td></tr>
          <tr data-time="${jadwal.Dhuhr}"><td>Dzuhur</td><td>${jadwal.Dhuhr}</td></tr>
          <tr data-time="${jadwal.Asr}"><td>Ashar</td><td>${jadwal.Asr}</td></tr>
          <tr data-time="${jadwal.Maghrib}"><td>Maghrib</td><td>${jadwal.Maghrib}</td></tr>
          <tr data-time="${jadwal.Isha}"><td>Isya</td><td>${jadwal.Isha}</td></tr>
        `;

        highlightNextPrayer();
      }

      // Highlight + countdown
      function highlightNextPrayer() {
        const rows = document.querySelectorAll("#jadwalSholat tbody tr");
        const now = new Date();

        let nextRow = null;
        let nextTime = null;

        rows.forEach((row) => {
          const timeStr = row.getAttribute("data-time");
          if (!timeStr || timeStr === "-") return;

          const [h, m] = timeStr.split(":").map(Number);
          if (isNaN(h) || isNaN(m)) return;

          const t = new Date();
          t.setHours(h, m, 0, 0);

          if (t > now && (!nextTime || t < nextTime)) {
            nextTime = t;
            nextRow = row;
          }
        });

        rows.forEach((row) => row.classList.remove("active"));

        if (!nextRow) {
          // Semua sholat hari ini sudah lewat → highlight Subuh besok
          nextRow = Array.from(rows).find((r) => r.textContent.includes("Subuh"));
          if (nextRow) {
            const [h, m] = nextRow.getAttribute("data-time").split(":").map(Number);
            nextTime = new Date();
            nextTime.setDate(nextTime.getDate() + 1);
            nextTime.setHours(h, m, 0, 0);
          }
        }

        if (nextRow) {
          nextRow.classList.add("active");
          updateCountdown(nextRow.cells[0].textContent, nextTime);
        }
      }

      function updateCountdown(prayerName, nextTime) {
        const countdownEl = document.getElementById("countdown");
        if (!nextTime) {
          countdownEl.textContent = "Jadwal berikutnya tidak ditemukan.";
          return;
        }

        function pad(n) {
          return n.toString().padStart(2, "0");
        }

        function refreshCountdown() {
          const now = new Date();
          const diff = nextTime - now;

          if (diff <= 0) {
            countdownEl.innerHTML = `<span>${prayerName}</span>Sedang berlangsung...`;
            highlightNextPrayer();
            return;
          }

          const h = Math.floor(diff / (1000 * 60 * 60));
          const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const s = Math.floor((diff % (1000 * 60)) / 1000);

          countdownEl.innerHTML = `<span>${prayerName} berikutnya</span>${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        refreshCountdown();
        clearInterval(window._countdownTimer);
        window._countdownTimer = setInterval(refreshCountdown, 1000);
      }

      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(showPosition, showError);
        }
      }

      function showPosition(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        fetchJadwalSholat(latitude, longitude, false);
      }

      function showError(error) {
        console.warn("Lokasi gagal, tetap pakai default:", error.message);
      }

      window.onload = function () {
        var body = document.body;
        var hammertime = new Hammer(body);

        hammertime.on("swipeleft", function () {
          window.location.href = "dashboard.html";
        });

        hammertime.on("swiperight", function () {
          window.location.href = "#";
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "ArrowLeft") {
            window.location.href = "#";
          } else if (event.key === "ArrowRight") {
            window.location.href = "dashboard.html";
          }
        });

        // Tampilkan default Jakarta
        fetchJadwalSholat(-6.2, 106.8);

        // Update jika user izinkan lokasi
        getLocation();

        // Update highlight tiap menit
        setInterval(highlightNextPrayer, 60000);
      };

      // Cegah akses source
      document.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.key === "u") event.preventDefault();
        if (
          (event.ctrlKey && event.shiftKey && (event.key === "I" || event.key === "J")) ||
          (event.ctrlKey && event.key === "s") ||
          event.key === "F12"
        ) {
          event.preventDefault();
        }
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
