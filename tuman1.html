<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وقت الصلاة</title>
    <link rel="stylesheet" href="styles4.css" />
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>

  </head>
  <body>
    <div class="dashboard-container">
      <header class="dashboard-header">
        <h1>وقت الصلاة</h1>
      </header>
      <main class="dashboard-content">
        <!-- Countdown di atas tabel -->
        <div id="countdown">Memuat...</div>

        

        <table id="jadwalSholat" class="jadwal-table">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Pukul</th>
            </tr>
          </thead>
          <tbody>
            <!-- Jadwal sholat akan diisi -->
          </tbody>
        </table>
        
      </main>
    </div>

    <script>
      const method = 1; // Metode Karachi
      let nextPrayerName = "";
      let nextPrayerTime = null;

      function fetchWithTimeout(resource, options = {}) {
        const { timeout = 5000 } = options;
        return Promise.race([
          fetch(resource),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Request Timeout")), timeout)
          ),
        ]);
      }

      function saveCache(data) {
        const today = new Date().toISOString().split("T")[0];
        localStorage.setItem(
          "jadwalSholat",
          JSON.stringify({ date: today, data })
        );
      }

      function loadCache() {
        const cache = localStorage.getItem("jadwalSholat");
        if (!cache) return null;
        const { date, data } = JSON.parse(cache);
        const today = new Date().toISOString().split("T")[0];
        return date === today ? data : null;
      }

      function fetchJadwalSholat(latitude, longitude, useCache = true) {
        const cached = loadCache();
        if (useCache && cached) {
          displayJadwalSholat(cached.timings, cached.meta.timezone);
          return;
        }

        const url = `https://api.aladhan.com/v1/timings/${Math.floor(
          Date.now() / 1000
        )}?latitude=${latitude}&longitude=${longitude}&method=${method}`;

        fetchWithTimeout(url, { timeout: 5000 })
          .then((response) => response.json())
          .then((data) => {
            if (data.code === 200) {
              const jadwal = data.data.timings;
              const location = data.data.meta.timezone;
              displayJadwalSholat(jadwal, location);
              saveCache(data.data);
            } else {
              console.error("Data tidak ditemukan.");
            }
          })
          .catch((error) => console.error("Error fetch jadwal:", error));
      }

      function displayJadwalSholat(jadwal, location) {
        const tbody =
          document.getElementById("jadwalSholat").getElementsByTagName("tbody")[0];

        function convertToDateTime(timeString) {
          const [hours, minutes] = timeString.split(":").map(Number);
          const now = new Date();
          now.setHours(hours, minutes, 0, 0);
          return now;
        }

        function addHours(date, hours) {
          const result = new Date(date);
          result.setHours(result.getHours() + hours);
          return result;
        }

        const subuhTime = convertToDateTime(jadwal.Fajr);
        const duhaTime = addHours(subuhTime, 2);

        tbody.innerHTML = `
          <tr data-name="Imsak" data-time="${jadwal.Imsak || ""}"><td>Imsak</td><td>${jadwal.Imsak || "-"}</td></tr>
          <tr data-name="Subuh" data-time="${jadwal.Fajr}"><td>Subuh</td><td>${jadwal.Fajr}</td></tr>
          <tr data-name="Duha" data-time="${duhaTime.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}"><td>Duha</td><td>${duhaTime.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</td></tr>
          <tr data-name="Dzuhur" data-time="${jadwal.Dhuhr}"><td>Dzuhur</td><td>${jadwal.Dhuhr}</td></tr>
          <tr data-name="Ashar" data-time="${jadwal.Asr}"><td>Ashar</td><td>${jadwal.Asr}</td></tr>
          <tr data-name="Maghrib" data-time="${jadwal.Maghrib}"><td>Maghrib</td><td>${jadwal.Maghrib}</td></tr>
          <tr data-name="Isya" data-time="${jadwal.Isha}"><td>Isya</td><td>${jadwal.Isha}</td></tr>
        `;

        highlightNextPrayer();
      }

      function highlightNextPrayer() {
        const rows = document.querySelectorAll("#jadwalSholat tbody tr");
        const now = new Date();

        let nextRow = null;
        let nextTime = null;

        rows.forEach((row) => {
          const timeStr = row.getAttribute("data-time");
          const name = row.getAttribute("data-name");
          if (!timeStr || timeStr === "-") return;

          const [h, m] = timeStr.split(":").map(Number);
          if (isNaN(h) || isNaN(m)) return;

          const t = new Date();
          t.setHours(h, m, 0, 0);

          if (t > now && (!nextTime || t < nextTime)) {
            nextTime = t;
            nextRow = row;
            nextPrayerName = name;
          }
        });

        rows.forEach((row) => row.classList.remove("active"));

        if (nextRow) {
          nextRow.classList.add("active");
          nextPrayerTime = nextTime;
        } else {
          // Semua lewat → highlight Subuh besok
          const subuhRow = Array.from(rows).find((r) =>
            r.getAttribute("data-name") === "Subuh"
          );
          if (subuhRow) subuhRow.classList.add("active");

          const [h, m] = subuhRow.getAttribute("data-time").split(":").map(Number);
          nextPrayerName = "Subuh";
          nextPrayerTime = new Date(now);
          nextPrayerTime.setDate(now.getDate() + 1);
          nextPrayerTime.setHours(h, m, 0, 0);
        }

        updateCountdown();
      }

      function updateCountdown() {
        const countdownEl = document.getElementById("countdown");
        if (!nextPrayerTime || !nextPrayerName) {
          countdownEl.textContent = "Memuat...";
          return;
        }

        const now = new Date();
        let diff = nextPrayerTime - now;

        if (diff <= 0) {
          highlightNextPrayer();
          return;
        }

        const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, "0");
        diff %= 1000 * 60 * 60;
        const minutes = String(Math.floor(diff / (1000 * 60))).padStart(2, "0");
        diff %= 1000 * 60;
        const seconds = String(Math.floor(diff / 1000)).padStart(2, "0");

        // Update teks
        countdownEl.textContent = `Berikutnya ${nextPrayerName} ${hours}:${minutes}:${seconds}`;

        // Update warna sesuai sisa waktu
        countdownEl.className = "";
        const totalMinutes = (nextPrayerTime - now) / 60000;
        if (totalMinutes <= 10) {
          countdownEl.classList.add("urgent");
        } else if (totalMinutes <= 30) {
          countdownEl.classList.add("soon");
        }
      }

      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(showPosition, showError);
        }
      }

      function showPosition(position) {
        fetchJadwalSholat(position.coords.latitude, position.coords.longitude, false);
      }

      function showError(error) {
        console.warn("Lokasi gagal, tetap pakai default:", error.message);
      }

      window.onload = function () {
        var body = document.body;
        var hammertime = new Hammer(body);

        hammertime.on("swipeleft", () => (window.location.href = "dashboard.html"));
        hammertime.on("swiperight", () => (window.location.href = "#"));

        document.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") window.location.href = "#";
          else if (event.key === "ArrowRight") window.location.href = "dashboard.html";
        });

        fetchJadwalSholat(-6.2, 106.8);
        getLocation();

        setInterval(updateCountdown, 1000);
        setInterval(highlightNextPrayer, 60000);
      };

      // Cegah akses source
      document.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.key === "u") event.preventDefault();
        if (
          (event.ctrlKey &&
            event.shiftKey &&
            (event.key === "I" || event.key === "J")) ||
          (event.ctrlKey && event.key === "s") ||
          event.key === "F12"
        ) {
          event.preventDefault();
        }
      });
      document.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
