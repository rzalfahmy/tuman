name: Update Jadwal Sholat Harian Jakarta

on:
  schedule:
    - cron: '5 17 * * *'  # Jalan tiap 00:05 WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write  # ✅ penting untuk bisa commit & push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # ambil semua commit agar bisa rebase

      - name: Ambil data jadwal dari Aladhan API (Jakarta)
        run: |
          curl -s "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=2" \
          | jq '{updated_at: (now | todate), location: "Jakarta", data: .data}' > jadwal.json

      - name: Konfigurasi Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dan push perubahan
        run: |
          BRANCH=$(git branch --show-current)
          echo "Branch aktif: $BRANCH"

          git add jadwal.json

          # Cek apakah ada perubahan
          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan untuk dikomit."
          else
            echo "📝 Melakukan commit dan push..."
            git commit -m "Update jadwal sholat harian (Jakarta)"

            # Tarik perubahan terbaru untuk hindari konflik
            git pull --rebase origin $BRANCH || echo "⚠️ Tidak bisa rebase, lanjut push langsung"

            # Push dengan force-with-lease (aman)
            git push origin HEAD:$BRANCH --force-with-lease || echo "⚠️ Push gagal tapi workflow lanjut"
          fi
