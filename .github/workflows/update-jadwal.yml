name: Update Jadwal Sholat Harian Jakarta

on:
  schedule:
    - cron: '5 17 * * *'  # Jalan tiap 00:05 WIB (UTC+7)
  workflow_dispatch:      # Bisa dijalankan manual juga

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch prayer times data from API
        run: |
          echo "📦 Mengambil data dari Aladhan API..."
          response=$(curl -s "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=2")
          echo "$response" | jq '.' > jadwal.json

          if [ ! -s jadwal.json ]; then
            echo "❌ Gagal mengambil data dari API. File lama dipertahankan."
            exit 1
          fi

          echo "✅ Data berhasil diperbarui:"
          jq '.data.timings' jadwal.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk dikomit."
          else
            git add jadwal.json
            git commit -m "🔄 Update jadwal sholat harian Jakarta"
            git push
          fi
