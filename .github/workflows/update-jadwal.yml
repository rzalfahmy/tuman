name: Update Jadwal Sholat Harian Jakarta

on:
  schedule:
    - cron: '5 17 * * *'  # Jalan tiap 00:05 WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ambil data jadwal dari Aladhan API (Jakarta)
        run: |
          echo "📦 Mengambil data dari Aladhan API..."
          response=$(curl -s -H "User-Agent: GitHubActionsBot" "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=2")

          echo "🔍 Hasil raw API:"
          echo "$response"

          # Periksa apakah API mengembalikan status OK
          if echo "$response" | jq -e '.code == 200' >/dev/null; then
            echo "$response" | jq '{updated_at: (now | todate), location: "Jakarta", data: .data}' > jadwal.json
            echo "✅ Data jadwal berhasil diperbarui."
            cat jadwal.json
          else
            echo "❌ Gagal mengambil data dari API. File lama dipertahankan."
            exit 1
          fi

      - name: Konfigurasi Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dan push perubahan
        run: |
          BRANCH=$(git branch --show-current)
          echo "Branch aktif: $BRANCH"

          git add jadwal.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk dikomit."
          else
            git commit -m "Update jadwal sholat harian (Jakarta)"
            git pull --rebase origin $BRANCH || true
            git push origin HEAD || echo "Push gagal tapi workflow tetap lanjut"
          fi
