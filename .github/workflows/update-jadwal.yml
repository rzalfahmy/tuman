name: Update Jadwal Sholat Harian

on:
  schedule:
    - cron: '5 17 * * *'  # Jalan tiap 00:05 WIB (UTC+7)
  workflow_dispatch:      # Bisa dijalankan manual juga dari GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ambil data jadwal dari Aladhan API (Kabupaten Bogor)
        run: |
          curl -s "https://api.aladhan.com/v1/timingsByCity?city=Kabupaten%20Bogor&country=Indonesia&method=1" \
          | jq '{updated_at: (now | todate), location: "Kabupaten Bogor", data: .data}' > jadwal.json

      - name: Commit dan push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jadwal.json
          git commit -m "Update jadwal sholat harian (Kabupaten Bogor)" || echo "Tidak ada perubahan untuk dikomit."
          git push
