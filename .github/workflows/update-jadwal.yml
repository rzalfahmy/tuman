name: Update Jadwal Sholat Harian Jakarta

on:
  schedule:
    - cron: '5 17 * * *'  # Jalan tiap 00:05 WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 📦 Mengambil data dari Aladhan API...
        run: |
          echo "📦 Mengambil data dari Aladhan API..."
          RESPONSE=$(curl -s -w "%{http_code}" -o response.json "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=2")

          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Gagal mengambil data dari API. File lama dipertahankan."
            exit 1
          fi

          jq '{updated_at: (now | todate), location: "Jakarta", data: .data}' response.json > jadwal.json
          cat jadwal.json  # tampilkan isi jadwal.json di log

      - name: Konfigurasi Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dan push perubahan
        run: |
          BRANCH=$(git branch --show-current)
          git add jadwal.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk dikomit."
          else
            git commit -m "Update jadwal sholat harian (Jakarta)"
            git pull --rebase origin $BRANCH || true
            git push origin HEAD || echo "Push gagal tapi workflow tetap lanjut"
          fi
