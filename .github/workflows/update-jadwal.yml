name: Update Jadwal Sholat Harian Jakarta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ambil data mentah dari API
        run: |
          echo "Mengambil data dari API..."
          curl -s "https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=2" > api_raw.json
          echo "✅ Data mentah berhasil disimpan ke api_raw.json"
          echo "Menampilkan 20 baris pertama:"
          head -n 20 api_raw.json

      - name: Ubah format ke jadwal.json
        run: |
          echo "Membuat file jadwal.json dengan format baru..."
          jq '{updated_at: (now | todate), location: "Jakarta", data: .data}' api_raw.json > jadwal.json || cp api_raw.json jadwal.json
          echo "✅ File jadwal.json berhasil dibuat"
          echo "Menampilkan isi jadwal.json:"
          head -n 20 jadwal.json

      - name: Commit dan push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jadwal.json api_raw.json
          git commit -m "Update jadwal sholat harian (Jakarta)" || echo "Tidak ada perubahan"
          git pull --rebase origin $(git branch --show-current) || true
          git push origin HEAD || echo "Push gagal tapi workflow lanjut"
